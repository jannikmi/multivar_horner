name: build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install tox
      - name: Test both accelerator configurations
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          PYTHON_FACTOR="py${PYTHON_VERSION//./}"
          tox -e "${PYTHON_FACTOR},${PYTHON_FACTOR}-numba"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install tox
      - run: tox -e docs

  locked-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install poetry==2.2.1
      - run: poetry check --lock
      - run: poetry sync --with docs --extras numba
      - run: poetry run python -m pip check
      - name: Test with locked dependencies
        env:
          EXPECT_NUMBA: "1"
        run: poetry run python -m pytest
      - run: poetry run sphinx-build -W --keep-going -b html docs docs/_build/html
      - name: Check locked environment tooling
        run: |
          poetry run nodeenv --version
          poetry run tox run -e py312 --notest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  smoke:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distribution: [wheel, sdist]
        backend: [c, numba]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist
      - name: Install and evaluate outside the checkout
        env:
          DISTRIBUTION: ${{ matrix.distribution }}
          BACKEND: ${{ matrix.backend }}
        run: |
          python -m venv "$RUNNER_TEMP/consumer"
          PYTHON="$RUNNER_TEMP/consumer/bin/python"
          if [ "$DISTRIBUTION" = wheel ]; then
            ARTIFACT=("$GITHUB_WORKSPACE"/dist/*.whl)
          else
            ARTIFACT=("$GITHUB_WORKSPACE"/dist/*.tar.gz)
          fi
          REQUIREMENT="${ARTIFACT[0]}"
          if [ "$BACKEND" = numba ]; then
            REQUIREMENT="${REQUIREMENT}[numba]"
          fi
          "$PYTHON" -m pip install "$REQUIREMENT"
          "$PYTHON" -m pip check
          cp scripts/smoke_installed.py "$RUNNER_TEMP/smoke_installed.py"
          cd "$RUNNER_TEMP"
          "$PYTHON" -I smoke_installed.py "$BACKEND"

  deploy:
    runs-on: ubuntu-latest
    needs: [test, lint, docs, smoke, locked-dependencies]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist
      - name: Fetch version
        id: fetch_version
        run: |
          python -c 'import tomllib; print("version_nr=" + tomllib.load(open("pyproject.toml", "rb"))["tool"]["poetry"]["version"])' >> "$GITHUB_OUTPUT"
      - name: PyPI Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_DEPLOYMENT_API_KEY }}
          skip-existing: true
      - name: Verify installation from PyPI
        env:
          VERSION: ${{ steps.fetch_version.outputs.version_nr }}
        run: |
          python -m venv "$RUNNER_TEMP/pypi-consumer"
          PYTHON="$RUNNER_TEMP/pypi-consumer/bin/python"
          for attempt in 1 2 3 4 5; do
            if "$PYTHON" -m pip install --no-cache-dir "multivar_horner==$VERSION"; then
              break
            fi
            if [ "$attempt" = 5 ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done
          "$PYTHON" -m pip check
          mkdir "$RUNNER_TEMP/pypi-distributions"
          "$PYTHON" -m pip download --no-cache-dir --no-deps --only-binary=:all: \
            --dest "$RUNNER_TEMP/pypi-distributions" "multivar_horner==$VERSION"
          "$PYTHON" -m pip download --no-cache-dir --no-deps --no-binary=:all: \
            --dest "$RUNNER_TEMP/pypi-distributions" "multivar_horner==$VERSION"
          diff \
            <(cd "$GITHUB_WORKSPACE/dist" && sha256sum * | sort) \
            <(cd "$RUNNER_TEMP/pypi-distributions" && sha256sum * | sort)
          cp scripts/smoke_installed.py "$RUNNER_TEMP/smoke_installed.py"
          cd "$RUNNER_TEMP"
          "$PYTHON" -I smoke_installed.py c
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.fetch_version.outputs.version_nr }}
          name: Release ${{ steps.fetch_version.outputs.version_nr }}
          draft: false
          prerelease: false
          skipIfReleaseExists: true
