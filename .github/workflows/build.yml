name: build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        numpy: ["numpy2"]
        include:
          - python-version: "3.12"
            numpy: numpy1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install tox
      - name: Test both accelerator configurations
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
          NUMPY_FACTOR: ${{ matrix.numpy }}
        run: |
          PYTHON_FACTOR="py${PYTHON_VERSION//./}"
          tox -e "${PYTHON_FACTOR}-${NUMPY_FACTOR},${PYTHON_FACTOR}-${NUMPY_FACTOR}-numba"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install tox
      - run: tox -e docs

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  smoke:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distribution: [wheel, sdist]
        backend: [c, numba]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Install and evaluate outside the checkout
        env:
          DISTRIBUTION: ${{ matrix.distribution }}
          BACKEND: ${{ matrix.backend }}
        run: |
          python -m venv "$RUNNER_TEMP/consumer"
          PYTHON="$RUNNER_TEMP/consumer/bin/python"
          if [ "$DISTRIBUTION" = wheel ]; then
            ARTIFACT=("$GITHUB_WORKSPACE"/dist/*.whl)
          else
            ARTIFACT=("$GITHUB_WORKSPACE"/dist/*.tar.gz)
          fi
          REQUIREMENT="${ARTIFACT[0]}"
          if [ "$BACKEND" = numba ]; then
            REQUIREMENT="${REQUIREMENT}[numba]"
          fi
          "$PYTHON" -m pip install "$REQUIREMENT"
          "$PYTHON" -m pip check
          cp scripts/smoke_installed.py "$RUNNER_TEMP/smoke_installed.py"
          cd "$RUNNER_TEMP"
          "$PYTHON" -I smoke_installed.py "$BACKEND"

  deploy:
    runs-on: ubuntu-latest
    needs: [test, lint, docs, smoke]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Fetch version
        id: fetch_version
        run: |
          python -c 'import tomllib; print("version_nr=" + tomllib.load(open("pyproject.toml", "rb"))["tool"]["poetry"]["version"])' >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.fetch_version.outputs.version_nr }}
          name: Release ${{ steps.fetch_version.outputs.version_nr }}
          draft: false
          prerelease: false
          skipIfReleaseExists: true
      - name: PyPI Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_DEPLOYMENT_API_KEY }}
          skip-existing: true
