version: 2
updates:
  # Poetry projects use the "pip" ecosystem; Dependabot reads pyproject.toml
  # and poetry.lock from the given directory (a directory, not a file).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
