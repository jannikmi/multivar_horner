[tool.poetry]
name = "multivar_horner"
version = "3.2.0"
license = "MIT"
readme = "README.rst"
repository = "https://github.com/jannikmi/multivar_horner"
homepage = "https://multivar-horner.readthedocs.io/en/latest/"
documentation = "https://multivar-horner.readthedocs.io/en/latest/"
keywords = ["mathematics", "polynomials", "evaluation", "multivariate", "horner-scheme"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]
description = "python package implementing a multivariate Horner scheme for efficiently evaluating multivariate polynomials"
authors = ["jannikmi <github@michelfe.it>"]
include = [
    ".editorconfig",
    ".pre-commit-config.yaml",
    "CHANGELOG.rst",
    "CONTRIBUTING.rst",
    "LICENSE",
    "Makefile",
    "README.rst",
    "tox.ini",
    "tests/*.py",
]
#exclude = ["scripts/*.py"]


[tool.poetry.dependencies]
# Python baseline follows SPEC 0 (reviewed September 2026):
# https://scientific-python.org/specs/spec-0000/
python = ">=3.12,<4"
numpy = ">=1.23,<2.5"
numba = { version = ">=0.64,<1", optional = true }


[tool.poetry.extras]
numba = ["numba"]


[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
Sphinx = "^5"
sphinx-rtd-theme = "^1"
sphinxcontrib-bibtex = "*"

[tool.poetry.group.dev.dependencies]
pytest = "^7"
pytest-cov = "*"
tox = "*"
hypothesis = "^6.68.1"
twine = "*"
pre-commit = "*"
rstcheck = "*"
#build = "^0.8.0"
ruff = "^0.3.2"

[build-system]
requires = ["poetry-core>=2.2,<3"]
build-backend = "poetry.core.masonry.api"


[tool.ruff]
target-version = "py312"
src = ["multivar_horner", "tests"]

[tool.ruff.lint.isort]
known-local-folder = ["multivar_horner", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py", "hypothesis_tests.py"]

[tool.tox]
legacy_tox_ini = """
    [tox]
    envlist =
        py312-numpy{1,2}{,-numba},py{313,314}-numpy2{,-numba},docs

    [testenv]
    package = wheel
    extras =
        numba: numba
    deps =
        pytest>=7
        hypothesis>=6.68.1
        numpy1: numpy>=1.23,<2
        numpy2: numpy>=2,<2.5
    setenv =
        !numba: EXPECT_NUMBA=0
        numba: EXPECT_NUMBA=1
    commands = python -m pytest {posargs}

    [testenv:docs]
    basepython = python3.12
    deps =
        Sphinx>=5,<6
        sphinx-rtd-theme>=1,<2
        sphinxcontrib-bibtex
    commands = sphinx-build -W --keep-going -b html docs {envtmpdir}/html
"""
